# Veröffentlicht die fertig gebaute Web-Version aus docs/ auf GitHub Pages.
# docs/ entsteht lokal mit:  python3 lehrkraft/veroeffentlichen.py <pfad-zum-baukasten>
# Das ZIP „webversion-plesk“ (unter dem jeweiligen Lauf) kann direkt auf einen eigenen Webserver.
name: Web-Version veröffentlichen

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: webversion-plesk
          path: docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
