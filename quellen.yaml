- id: q-ms-tasten
  titel: Microsoft Support – Tastenkombinationen in Word
  url: https://support.microsoft.com/de-de/office/tastenkombinationen-in-word-95ef89dd-7142-4b50-afb2-f762f663ceb2
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: >-
    Strg+Alt+1/2/3 (Überschrift 1–3), Strg+Umschalt+N (Standard), Strg+Alt+F (Fußnote), Strg+Eingabetaste (Seitenumbruch),
    F9 (Felder aktualisieren), Strg+Leertaste / Strg+Q (Zeichen-/Absatzformatierung entfernen), Strg+H (Ersetzen).
    ACHTUNG: Die Seite nennt Kürzel für das US-Layout (z. B. Fett = Strg+B). Im deutschen Word ist Strg+B Blocksatz –
    der Lernpfad nennt deshalb für Fett/Kursiv/Blocksatz die Knöpfe, keine Kürzel.

- id: q-ms-beschriftung
  titel: Microsoft Support – Einfügen, Hinzufügen oder Entfernen von Beschriftungen in Word
  url: https://support.microsoft.com/de-de/office/einf%C3%BCgen-hinzuf%C3%BCgen-oder-entfernen-von-beschriftungen-in-word-82fa82a4-f0f3-438f-a422-34bb5cef9c81
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: Beschriftung einfügen auf der Registerkarte „Verweise“ (in Microsoft 365 heißt sie „Referenzen“), Felder mit F9 aktualisieren.

- id: q-word-menues
  titel: Word (Microsoft 365) – Menüpfade Layout › Seitenränder, Layout › Silbentrennung, Layout › Umbrüche › Nächste Seite, Kopf- und Fußzeile › Mit vorheriger verknüpfen, Seitenzahl › Seitenzahlen formatieren › Beginnen bei, Referenzen › Inhaltsverzeichnis
  url: https://support.microsoft.com/de-de/word
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: >-
    Menüpfade stimmen mit den erprobten Arbeitsblättern der Lehrkraft überein; Registerkarte „Referenzen“ (Microsoft 365) bzw.
    „Verweise“ (ältere Versionen, manche Hilfeseiten). Der Lernpfad nennt beide Namen.

