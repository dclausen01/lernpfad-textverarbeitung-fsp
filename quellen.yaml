- id: q-richtlinien
  titel: Richtlinien für schriftliche Ausarbeitungen an der Fachschule für Sozialpädagogik in Rendsburg (mit APA), Stand 21.11.2025
  url: ""
  art: lehrplan
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: >-
    Formatvorgaben (DIN A4, Ränder 2,5/3/2,5/2,5, Arial 12, Überschriften 14 pt fett, Zeilenabstand 1,5, Fußnoten 9 pt 1-zeilig,
    Blocksatz + Silbentrennung, Seitenzahl 1 auf der ersten Fließtextseite), Aufbau, Deckblatt-Angaben, numerische Gliederung,
